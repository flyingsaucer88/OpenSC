# OpenSC PKCS#11 Configuration for Android
# Point to the Android-built OpenSC PKCS#11 library

name = OpenSC-Android
library = /data/data/your.package.name/lib/opensc-pkcs11.so
description = OpenSC Smart Card Framework for Android
slotListIndex = 0

# Attributes
attributes(*, CKO_CERTIFICATE, *) = {
  CKA_TOKEN = true
}

attributes(*, CKO_PUBLIC_KEY, *) = {
  CKA_TOKEN = true
}

attributes(*, CKO_PRIVATE_KEY, *) = {
  CKA_TOKEN = true
  CKA_SENSITIVE = true
  CKA_EXTRACTABLE = false
}
