# OpenSC PKCS#11 Configuration
# This file configures the SunPKCS11 provider to use OpenSC

name = OpenSC
library = /usr/local/lib/opensc-pkcs11.so
description = OpenSC Smart Card Framework
slotListIndex = 0

# Enable debug mode (optional, comment out for production)
# showInfo = true

# Attributes
attributes(*, CKO_CERTIFICATE, *) = {
  CKA_TOKEN = true
}

attributes(*, CKO_PUBLIC_KEY, *) = {
  CKA_TOKEN = true
}

attributes(*, CKO_PRIVATE_KEY, *) = {
  CKA_TOKEN = true
  CKA_SENSITIVE = true
  CKA_EXTRACTABLE = false
}
