# PKCS#11 module logging (opensc-pkcs11.dll / onepin-opensc-pkcs11.dll).
# Covers all callers: Firefox, Thunderbird, Adobe Reader, OpenVPN, etc.
# debug_file uses Windows ExpandEnvironmentStringsA, so %TEMP% resolves
# to the current user's temp folder at runtime without any admin rights.
# The log is opened in append mode; the file is created automatically.
# Remove or comment out this block to disable PKCS#11 debug logging.
app opensc-pkcs11 {
	debug = 3;
	debug_file = %TEMP%\opensc-pkcs11.log;
}
